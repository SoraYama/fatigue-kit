name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # v2 of this action renamed the `publish` input to `publish-script`.
      # `create-github-releases` and `push-git-tags` default to true, matching
      # the previous v1 behaviour. Requires Changesets CLI v3 (installed).
      - uses: changesets/action@v2
        with:
          # `changeset publish` (not raw `npm publish`): it compares git tags
          # and becomes a no-op when nothing is unpublished, and it creates the
          # version tags the action needs for GitHub releases.
          # The action execs this without a shell, so resolve the local bin
          # via npx (node_modules/.bin is not on PATH).
          publish-script: npx --no-install changeset publish
        env:
          # Kept for @changesets/changelog-github (version step). The action
          # itself authenticates via its `github-token` input default.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
