name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # v2 of this action requires Changesets CLI v3; until the CLI 3 toolchain
      # migration lands, stay on v1 (`publish:` input, CLI v2 compatible).
      - uses: changesets/action@v1
        with:
          # `changeset publish` (not raw `npm publish`): it compares git tags
          # and becomes a no-op when nothing is unpublished, and it creates the
          # version tags the action needs for GitHub releases.
          # The action execs this without a shell, so resolve the local bin
          # via npx (node_modules/.bin is not on PATH).
          publish: npx --no-install changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
